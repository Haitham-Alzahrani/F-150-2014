id: idle-quality
title: Idle quality — is there a fault, and if so what kind
description: |
  Establishes first whether the idle is actually abnormal, then what class of
  fault it is. Branches on measurements, not assumptions.

  The decisive comparison is long-term fuel trim at idle against 2500 rpm. An
  unmetered air leak is a large fraction of airflow at idle and a small one at
  2500, so its trim correction shrinks. A dilution or mechanical fault leaves
  trims near normal while the engine still runs rough. Those two findings send
  you to completely different places.

entry: intro

steps:
  - id: intro
    type: prompt
    text: |
      IDLE QUALITY PROTOCOL

      You will need: the vehicle at operating temperature, a clear area, and
      hose clamping pliers within reach.

      Nothing in this protocol writes to a control module.
    confirm: Press Enter to begin
    next: survey

  - id: survey
    type: service
    service: survey
    text: "Asking the vehicle what it is and what it supports…"
    next: check_egr

  - id: check_egr
    type: branch
    checks:
      - when: egr_supported
        finding: egr-present
        summary: "This vehicle DOES report EGR parameters — revise the assumption that the 3.7 has no external EGR"
        next: codes
      - next: codes

  - id: codes
    type: service
    service: dtcs
    text: "Reading stored, pending and permanent codes…"
    next: codes_branch

  - id: codes_branch
    type: branch
    checks:
      - when: dtc_permanent_count > 0
        finding: permanent-codes-present
        summary: "Permanent codes exist. These survived any battery disconnect — read them before anything else in this protocol."
        next: warmup
      - next: warmup

  - id: warmup
    type: prompt
    text: |
      Bring the engine to full operating temperature.

      Then:
        - transmission in PARK
        - air conditioning OFF
        - all electrical loads off
        - foot off the throttle
    confirm: Confirm warm, in Park, A/C off
    next: baseline

  - id: baseline
    type: measure
    label: idle_park
    seconds: 120
    pids: [idle]
    next: baseline_branch

  - id: baseline_branch
    type: branch
    checks:
      - when: rpm_periodic
        finding: idle-hunting
        summary: "Rpm oscillates with a repeating period — this is a hunt, not control scatter. A real fault."
        next: load_drive
      - when: rpm_p2p > 100
        finding: idle-unstable
        summary: "Rpm movement exceeds the fault threshold."
        next: load_drive
      - when: rpm_p2p <= 60
        finding: idle-normal
        summary: "Rpm movement is within normal closed-loop idle control. No engine fault is evident in this measurement."
        next: control_sample
      - next: load_drive

  - id: control_sample
    type: prompt
    text: |
      The rpm is stable within normal limits.

      If a vibration is still felt in the cab, the remaining question is
      whether it is abnormal for this vehicle rather than whether the engine
      is running badly. A base regular cab has little sound deadening and a
      60-degree V6 is not inherently balanced.

      The test that settles it: idle another F-150 regular cab of the same
      engine alongside. Hand on the fender, then sit in the cab.

      No further electronic testing will answer this.
    confirm: Press Enter to finish
    next: END

  - id: load_drive
    type: prompt
    text: |
      Now with load applied.

      Foot firmly on the brake. Select DRIVE. Keep the vehicle stationary.
    confirm: Confirm in Drive, brake held
    next: measure_drive

  - id: measure_drive
    type: measure
    label: idle_drive
    seconds: 60
    pids: [idle]
    next: rev_prompt

  - id: rev_prompt
    type: prompt
    text: |
      Return to PARK.

      Then hold a steady 2500 rpm with no load for the next minute. Steady is
      what matters — a wandering foot will read as a wandering engine.
    confirm: Confirm holding 2500 rpm
    next: measure_2500

  - id: measure_2500
    type: measure
    label: rpm_2500
    seconds: 60
    pids: [idle]
    next: trim_branch

  - id: trim_branch
    type: branch
    checks:
      - when: idle_park.ltft_mean > 10 and rpm_2500.ltft_mean < idle_park.ltft_mean - 5
        finding: unmetered-air
        summary: "Long-term trim is high at idle and falls at 2500 rpm. That is the signature of an unmetered air leak."
        next: leak_purge
      - when: idle_park.ltft_mean > 10
        finding: fuel-metering
        summary: "Trim is high at both idle and 2500 rpm — metering or fuel supply rather than a leak."
        next: mode06
      - when: idle_park.ltft_mean < -10
        finding: running-rich
        summary: "Trim is strongly negative — the engine is being over-fuelled."
        next: mode06
      - when: idle_park.ltft_split > 8
        finding: single-bank
        summary: "The two banks disagree. Narrows the fault to one bank — three cylinders."
        next: mode06
      - finding: dilution-or-mechanical
        summary: "Rough idle with normal fuel trims. Fuel control is not the cause — this is dilution or mechanical."
        next: leak_purge

  - id: leak_purge
    type: prompt
    text: |
      EVAP PURGE VALVE TEST

      Engine idling in Park. Locate the hose running from the purge valve to
      the intake manifold and clamp it fully shut.

      Leave it clamped for the whole of the next measurement.

      The valve is normally closed when de-energised, so on a healthy system
      clamping this hose changes nothing.
    confirm: Confirm hose clamped
    next: measure_purge

  - id: measure_purge
    type: measure
    label: purge_clamped
    seconds: 60
    pids: [idle]
    next: purge_branch

  - id: purge_branch
    type: branch
    checks:
      - when: purge_clamped.rpm_p2p < idle_park.rpm_p2p * 0.6
        finding: evap-purge-stuck-open
        summary: "Clamping the purge line cut the rpm instability substantially. The purge valve was leaking."
        next: pcv_test
      - when: purge_clamped.ltft_mean < idle_park.ltft_mean - 5
        finding: evap-purge-stuck-open
        summary: "Fuel trim dropped with the purge line clamped — unmetered flow was coming through that valve."
        next: pcv_test
      - next: pcv_test

  - id: pcv_test
    type: prompt
    text: |
      PCV TEST

      Release the purge line clamp.

      With the engine running and hot, work the PCV hose and both elbows by
      hand along their whole length. Heat-hardened rubber splits open when
      flexed hot and closes up cold, so a cold inspection misses it.

      Then clamp the PCV hose shut for the next measurement. Keep it brief —
      blocking crankcase ventilation raises case pressure.
    ask: pcv_condition
    question: What did the PCV hose and elbows look like?
    options:
      - Sound - flexible, no cracks
      - Hardened or glazed but intact
      - Cracked or split
      - Could not access it
    next: measure_pcv

  - id: measure_pcv
    type: measure
    label: pcv_clamped
    seconds: 45
    pids: [idle]
    next: pcv_branch

  - id: pcv_branch
    type: branch
    checks:
      - when: pcv_clamped.rpm_p2p < idle_park.rpm_p2p * 0.6
        finding: pcv-leak
        summary: "Clamping the PCV hose cut the instability — air was entering through the crankcase ventilation path."
        next: booster_test
      - next: booster_test

  - id: booster_test
    type: prompt
    text: |
      BRAKE BOOSTER TEST

      Release the PCV clamp.

      Clamp the brake booster vacuum hose at idle. The vehicle is stationary
      and stays stationary for this test; brake assist is lost while the hose
      is clamped, and returns when it is released.

      If the idle changes, the booster or its check valve is leaking.
    confirm: Confirm booster hose clamped, vehicle stationary
    next: measure_booster

  - id: measure_booster
    type: measure
    label: booster_clamped
    seconds: 45
    pids: [idle]
    next: booster_branch

  - id: booster_branch
    type: branch
    checks:
      - when: booster_clamped.rpm_p2p < idle_park.rpm_p2p * 0.6
        finding: booster-leak
        summary: "Clamping the booster hose cut the instability — the booster or its check valve leaks."
        next: restore
      - next: restore

  - id: restore
    type: prompt
    text: |
      Release every clamp. Confirm each hose is back on its spigot and secured
      before continuing.
    confirm: Confirm all hoses restored
    next: mode06

  - id: mode06
    type: service
    service: mode06
    text: "Reading on-board monitor results (misfire, where the PCM reports it)…"
    next: mode06_branch

  - id: mode06_branch
    type: branch
    checks:
      - when: mode06_failing > 0
        finding: monitor-out-of-limits
        summary: "One or more on-board monitor tests are outside their limits."
        next: closing
      - next: closing

  - id: closing
    type: prompt
    text: |
      Electronic testing for this protocol is complete.

      If the finding was 'dilution or mechanical' with normal trims, the next
      branch is variable cam timing — commanded against actual cam position,
      and swapping the VCT solenoids bank to bank. Those are Ford enhanced
      parameters and need FORScan; this tool cannot read them.
    confirm: Press Enter for the findings summary
    next: END
