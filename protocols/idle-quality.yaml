id: idle-quality
title: Idle quality — is there a fault, and if so what kind
description: |
  Establishes first whether the idle is actually abnormal, then what class of
  fault it is. Branches on measurements, not assumptions.

  The decisive comparison is long-term fuel trim at idle against 2500 rpm. An
  unmetered air leak is a large fraction of airflow at idle and a small one at
  2500, so its trim correction shrinks. A dilution or mechanical fault leaves
  trims near normal while the engine still runs rough. Those two findings send
  you to completely different places.

  VACUUM TESTING RULE, and it governs the whole second half of this protocol:
  the lines on this engine are hard plastic. They cannot be clamped or
  pinched. The only way to isolate one is to disconnect it and plug the
  manifold port — and that must be done with the ENGINE OFF, because opening
  a manifold port on a running engine is a leak large enough to stall it.

  Every isolation test therefore runs: engine off, disconnect, plug, restart,
  stabilise, measure. Because each test involves a restart, the comparison
  baseline is taken the same way — started, stabilised, measured — so all four
  measurements are made under identical conditions.

entry: intro

steps:
  - id: intro
    type: prompt
    text: |
      IDLE QUALITY PROTOCOL

      You will need:
        - the vehicle at operating temperature
        - vacuum caps or plugs sized to the manifold ports (a golf tee, a
          bolt of the right diameter, or proper vacuum caps)
        - the three vacuum lines identified: EVAP purge, PCV, brake booster

      RULE FOR THE WHOLE SESSION: the engine is OFF for every disconnect and
      every reconnect. Never open a vacuum port on a running engine.

      Nothing in this protocol writes to a control module.
    confirm: Press Enter to begin
    next: survey

  - id: survey
    type: service
    service: survey
    text: "Asking the vehicle what it is and what it supports…"
    next: check_egr

  - id: check_egr
    type: branch
    checks:
      - when: egr_supported
        finding: egr-present
        summary: "This vehicle DOES report EGR parameters — revise the assumption that the 3.7 has no external EGR"
        next: codes
      - next: codes

  - id: codes
    type: service
    service: dtcs
    text: "Reading stored, pending and permanent codes…"
    next: codes_branch

  - id: codes_branch
    type: branch
    checks:
      - when: dtc_permanent_count > 0
        finding: permanent-codes-present
        summary: "Permanent codes exist. These survived any battery disconnect — read them before anything else in this protocol."
        next: warmup
      - next: warmup

  - id: warmup
    type: prompt
    text: |
      Bring the engine to full operating temperature.

      Then:
        - transmission in PARK
        - air conditioning OFF
        - all electrical loads off
        - foot off the throttle
    confirm: Confirm warm, in Park, A/C off
    next: baseline

  - id: baseline
    type: measure
    label: idle_park
    seconds: 120
    pids: [idle]
    next: baseline_branch

  - id: baseline_branch
    type: branch
    checks:
      - when: rpm_periodic
        finding: idle-hunting
        summary: "Rpm oscillates with a repeating period — this is a hunt, not control scatter. A real fault."
        next: load_drive
      - when: rpm_p2p > 100
        finding: idle-unstable
        summary: "Rpm movement exceeds the fault threshold."
        next: load_drive
      - when: rpm_p2p <= 60
        finding: idle-normal
        summary: "Rpm movement is within normal closed-loop idle control. No engine fault is evident in this measurement."
        next: control_sample
      - next: load_drive

  - id: control_sample
    type: prompt
    text: |
      The rpm is stable within normal limits.

      If a vibration is still felt in the cab, the remaining question is
      whether it is abnormal for this vehicle rather than whether the engine
      is running badly. A base regular cab has little sound deadening, and
      owners of the same 3.7 Cyclone engine in the Mustang have raised a
      vibration complaint that Ford's own position is normal operation.

      The test that settles it: idle another vehicle with this engine
      alongside. Hand on the fender, then sit in the cab.

      No further electronic testing will answer this.
    confirm: Press Enter to finish
    next: END

  - id: load_drive
    type: prompt
    text: |
      Now with load applied.

      Foot firmly on the brake. Select DRIVE. Keep the vehicle stationary.
    confirm: Confirm in Drive, brake held
    next: measure_drive

  - id: measure_drive
    type: measure
    label: idle_drive
    seconds: 60
    pids: [idle]
    next: rev_prompt

  - id: rev_prompt
    type: prompt
    text: |
      Return to PARK.

      Then hold a steady 2500 rpm with no load for the next minute. Steady is
      what matters — a wandering foot will read as a wandering engine.
    confirm: Confirm holding 2500 rpm
    next: measure_2500

  - id: measure_2500
    type: measure
    label: rpm_2500
    seconds: 60
    pids: [idle]
    next: trim_branch

  - id: trim_branch
    type: branch
    checks:
      - when: idle_park.ltft_mean > 10 and rpm_2500.ltft_mean < idle_park.ltft_mean - 5
        finding: unmetered-air
        summary: "Long-term trim is high at idle and falls at 2500 rpm. That is the signature of an unmetered air leak."
        next: vacuum_prep
      - when: idle_park.ltft_mean > 10
        finding: fuel-metering
        summary: "Trim is high at both idle and 2500 rpm — metering or fuel supply rather than a leak."
        next: mode06
      - when: idle_park.ltft_mean < -10
        finding: running-rich
        summary: "Trim is strongly negative — the engine is being over-fuelled."
        next: mode06
      - when: idle_park.ltft_split > 8
        finding: single-bank
        summary: "The two banks disagree. Narrows the fault to one bank — three cylinders."
        next: mode06
      - finding: dilution-or-mechanical
        summary: "Rough idle with normal fuel trims. Fuel control is not the cause — this is dilution or mechanical."
        next: vacuum_prep

  # ---------------------------------------------------------------------
  # Vacuum line isolation. Engine OFF for every connect and disconnect.
  #
  # Order is deliberate. Purge and booster should have NO effect on a healthy
  # engine when plugged, so they give a clean signal. PCV always changes the
  # idle a little because it is a metered air path in normal operation, so it
  # is the noisiest test and goes last.
  # ---------------------------------------------------------------------

  - id: vacuum_prep
    type: prompt
    text: |
      VACUUM LINE ISOLATION

      Three lines will be isolated one at a time: EVAP purge, brake booster,
      then PCV.

      The lines are hard plastic and cannot be clamped. Each test means
      disconnecting the line and plugging the MANIFOLD port — the port must be
      sealed, or you have replaced a suspected small leak with a certain large
      one and the measurement is worthless.

      ENGINE OFF for every disconnect and reconnect, without exception.

      First: confirm all three lines are currently connected and seated, and
      have your plugs ready.
    confirm: Confirm all lines connected, plugs ready
    next: ref_start

  - id: ref_start
    type: prompt
    text: |
      REFERENCE MEASUREMENT

      Start the engine and let it idle for 30 seconds before continuing, so
      fuel control settles after the restart.

      Every isolation test below involves a restart, so this reference is
      taken the same way. Comparing a restarted idle against a long-settled
      one would show a difference that means nothing.
    confirm: Confirm engine running and settled 30 s
    next: measure_ref

  - id: measure_ref
    type: measure
    label: base_ref
    seconds: 60
    pids: [idle]
    next: purge_isolate

  - id: purge_isolate
    type: prompt
    text: |
      TEST 1 — EVAP PURGE

      1. SHUT THE ENGINE OFF.
      2. Disconnect the purge line where it meets the intake manifold.
      3. Plug the manifold port so it is fully sealed.
      4. Leave the hose end from the purge valve open to atmosphere.
      5. Start the engine and let it idle 30 seconds.

      The purge valve should contribute nothing at idle on a healthy system,
      so sealing this port should change nothing at all. If the idle improves,
      the valve was passing.
    confirm: Confirm purge port plugged, engine running and settled
    next: measure_purge

  - id: measure_purge
    type: measure
    label: purge_plugged
    seconds: 60
    pids: [idle]
    next: purge_branch

  - id: purge_branch
    type: branch
    checks:
      - when: purge_plugged.rpm_p2p < base_ref.rpm_p2p * 0.6
        finding: evap-purge-stuck-open
        summary: "Sealing the purge port cut the rpm instability substantially. The purge valve was leaking."
        next: booster_isolate
      - when: purge_plugged.ltft_mean < base_ref.ltft_mean - 5
        finding: evap-purge-stuck-open
        summary: "Fuel trim dropped with the purge port sealed — unmetered flow was coming through that valve."
        next: booster_isolate
      - next: booster_isolate

  - id: booster_isolate
    type: prompt
    text: |
      TEST 2 — BRAKE BOOSTER

      1. SHUT THE ENGINE OFF.
      2. Reconnect the purge line and seat it properly.
      3. Disconnect the booster hose at the manifold and plug that port.
      4. Start the engine and let it idle 30 seconds.

      The vehicle stays stationary for this test. With the booster isolated it
      keeps only its stored vacuum, so assist fades after a few pedal
      applications and returns once the line is reconnected.

      As with the purge line, sealing this port should change nothing on a
      healthy system.
    confirm: Confirm purge restored, booster port plugged, engine settled
    next: measure_booster

  - id: measure_booster
    type: measure
    label: booster_plugged
    seconds: 60
    pids: [idle]
    next: booster_branch

  - id: booster_branch
    type: branch
    checks:
      - when: booster_plugged.rpm_p2p < base_ref.rpm_p2p * 0.6
        finding: booster-leak
        summary: "Sealing the booster port cut the instability — the booster or its check valve leaks."
        next: pcv_isolate
      - next: pcv_isolate

  - id: pcv_isolate
    type: prompt
    text: |
      TEST 3 — PCV

      1. SHUT THE ENGINE OFF.
      2. Reconnect the booster hose and seat it properly.
      3. Disconnect the PCV line at the manifold and plug that port.
      4. Start the engine and let it idle 30 seconds.

      Read this one differently from the other two. PCV is a metered air path
      in normal operation, so sealing it WILL shift the idle slightly even on
      a healthy engine. That shift is not the signal.

      What matters is whether the INSTABILITY reduces — the wander and the
      roughness — not whether the rpm number moves.

      Keep this test brief. Blocked ventilation raises crankcase pressure.

      While you are there: pull the PCV valve and shake it. No rattle means it
      is clogged. It sits on the passenger-side valve cover, roughly halfway
      towards the front of the engine. [VERIFY location on the F-150 — that
      position is documented for the Mustang 3.7, which is the same engine]
    ask: pcv_condition
    question: What did the PCV valve and its hose look like?
    options:
      - Valve rattles, hose sound
      - Valve does not rattle - clogged
      - Hose or elbow cracked or hardened
      - Could not access it
    next: measure_pcv

  - id: measure_pcv
    type: measure
    label: pcv_plugged
    seconds: 45
    pids: [idle]
    next: pcv_branch

  - id: pcv_branch
    type: branch
    checks:
      - when: pcv_condition == "Valve does not rattle - clogged"
        finding: pcv-leak
        summary: "The PCV valve is clogged — it does not rattle. Replace it regardless of what the measurement showed."
        next: restore
      - when: pcv_condition == "Hose or elbow cracked or hardened"
        finding: pcv-leak
        summary: "Cracked or hardened PCV hose found by inspection. That is an unmetered air leak."
        next: restore
      - when: pcv_plugged.rpm_p2p < base_ref.rpm_p2p * 0.6
        finding: pcv-leak
        summary: "Sealing the PCV port cut the instability — air was entering through the crankcase ventilation path."
        next: restore
      - next: restore

  - id: restore
    type: prompt
    text: |
      RESTORE

      1. SHUT THE ENGINE OFF.
      2. Reconnect the PCV line.
      3. Check every one of the three lines is back on its spigot and fully
         seated, and that no plug has been left in a port.
      4. Start the engine and confirm the idle is as it was at the start.

      A plug left behind is a vacuum leak you created and will chase later.
    confirm: Confirm all three lines restored and verified, no plugs left
    next: mode06

  - id: mode06
    type: service
    service: mode06
    text: "Reading on-board monitor results (misfire, where the PCM reports it)…"
    next: mode06_branch

  - id: mode06_branch
    type: branch
    checks:
      - when: mode06_failing > 0
        finding: monitor-out-of-limits
        summary: "One or more on-board monitor tests are outside their limits."
        next: vct_decision
      - next: vct_decision

  - id: vct_decision
    type: branch
    checks:
      - when: idle_park.ltft_mean < 10 and idle_park.ltft_mean > -10 and (rpm_periodic or rpm_p2p > 100)
        next: vct_offer
      - next: closing

  - id: vct_offer
    type: prompt
    text: |
      The idle is unstable but the fuel trims are normal.

      Fuel control is therefore not the cause — it corrects mixture, and
      mixture is not what is wrong. That leaves charge dilution or something
      mechanical, and on this engine the dilution path is the cam phasers:
      there is no external EGR valve, and internal EGR is made by valve
      overlap.

      Cam position commanded against actual is a Ford enhanced parameter that
      this tool cannot read. FORScan can. The next step hands the adapter over,
      collects FORScan's export automatically, and continues from the result.
    ask: run_vct
    question: Run the FORScan cam timing handoff now?
    options:
      - Yes - FORScan is installed and ready
      - No - do it in a later session
    next: vct_branch

  - id: vct_branch
    type: branch
    checks:
      - when: run_vct == "Yes - FORScan is installed and ready"
        next: vct_handoff
      - next: closing

  - id: vct_handoff
    type: handoff
    request: vct
    label: vct
    seconds: 90
    timeout_s: 1200
    next: vct_verdict

  - id: vct_verdict
    type: branch
    checks:
      - when: not vct.imported
        finding: vct-no-data
        summary: "No FORScan export was collected — cam timing remains unmeasured. Run: f150diag run vct-check"
        next: closing
      - when: vct_pairs == 0
        finding: vct-no-channels
        summary: "The export carried no cam channels. Check FORScan's parameter names against the mapping report."
        next: closing
      - when: vct_worst_error > 5 or vct_actual_periodic
        finding: vct-solenoid-phaser
        summary: "Cam position does not follow the command. Swap the VCT solenoids bank to bank to separate solenoid from phaser."
        next: closing
      - finding: vct-tracks-correctly
        summary: "Cam position tracks the command. Variable cam timing is not the cause."
        next: closing

  - id: closing
    type: prompt
    text: |
      Electronic testing for this protocol is complete.

      Anything still unresolved after this is mechanical and needs the engine
      opened, or it was never a fault to begin with — see the control-sample
      test in the knowledge base entry `idle-normal`.
    confirm: Press Enter for the findings summary
    next: END
