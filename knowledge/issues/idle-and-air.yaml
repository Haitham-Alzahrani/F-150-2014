# Issues whose effect scales with manifold vacuum: worst at idle and light
# load, absent under real load. Load signature is the primary discriminator.
#
# Every unverified source carries `check:` — the specific claim to confirm
# when somebody can reach it. See `f150diag kb verify`.

- id: idle-normal
  title: Idle vibration within normal limits for the vehicle
  summary: >
    Not every felt vibration is a fault. A base regular cab has minimal sound
    deadening and sits close to the engine, and a 60-degree V6 is not
    inherently balanced the way an inline-six or a cross-plane V8 is.
  systems: [nvh]
  symptoms:
    - small vibration felt in the cab at idle
    - inaudible from under the hood
    - normal idle rpm
    - no codes
    - unchanged by every repair attempted
  load_signature: worst-at-idle
  temperature: independent
  sets_code: never
  tests:
    - "Log rpm for 120 s at warm idle: peak-to-peak under about 60 rpm with no periodic structure is normal control behaviour"
    - "Idle a second vehicle of the same cab and engine alongside and compare by hand and by seat"
  fix: None required.
  cost: Free to establish.
  provenance:
    - source: inferred
      confidence: medium
      verified: false
      note: >
        Reasoned from this truck's own evidence: never smooth in the owner's
        ownership, no code in years, normal idle rpm, flawless under load, and
        six competent repairs across six systems that each changed nothing.
      check: >
        Confirm the 3.7 Cyclone has no balance shaft, and confirm the 60-degree
        bank angle, against the service manual or the Cyclone engine reference.
        A 60-degree V6 without a balance shaft has an inherent rocking couple;
        if this engine has one, this entry's mechanism is weaker.
      url: https://en.wikipedia.org/wiki/Ford_Cyclone_engine
    - source: community
      confidence: medium
      verified: false
      note: >
        SAME ENGINE, DIFFERENT VEHICLE. Owners of the 2011-2014 Mustang 3.7 V6
        raised a vibration complaint large enough to reach a public petition,
        and Ford's stated position is that it is normal operation of the
        vehicle - one owner was reportedly told it is normal "because of the
        twin cam setup". Ford technicians who rode along were reported to
        disagree informally. From search summaries.
      check: >
        Read the petition and the Mustang forum threads and establish WHERE
        the vibration is felt and at what rpm. The Mustang accounts describe
        roughly 2200-2800 rpm and vibration through the shifter, which is NOT
        the same as this truck's idle vibration. The valuable part is Ford's
        position that a 3.7 vibration is normal for this engine; the symptom
        described may be a different one.
      url: https://www.change.org/p/ford-motor-company-2011-2014-mustang-3-7-v6-vibration-issue
    - source: community
      confidence: low
      verified: false
      note: >
        Mustang owners of the same engine discussing idle vibration, including
        vibration felt when stopped in gear.
      check: >
        Look for any account matching THIS truck's pattern specifically: small
        idle vibration, worst in Park and Neutral, less in gear, absent under
        load, no codes.
      url: https://www.mustangevolution.com/threads/engine-vibration-when-stopped-in-gear.369539/
  notes: >
    Always test this before spending. A fault that resists every repair is
    often not a fault.

    The Mustang 3.7 uses the same Cyclone engine as this truck, so its owner
    community is a legitimate and much larger source for engine-specific
    behaviour. Vehicle-specific claims (mounts, cab, driveline, exhaust) do
    NOT transfer; engine-specific ones do.

- id: evap-purge-stuck-open
  title: EVAP purge valve stuck partly open
  summary: >
    The purge valve is normally closed when de-energised. Held open by debris
    or a failed solenoid it becomes a permanent unmetered leak of air and fuel
    vapour into the intake, worst at idle where it is a large fraction of
    total airflow.
  systems: [evap, intake]
  symptoms:
    - rough or shaking idle when stopped
    - unstable rpm at idle
    - can stall at low speed in severe cases
    - hard starting after refuelling
    - often no code at all
  codes: [P0441, P0443, P0446, P0496]
  load_signature: worst-at-idle
  temperature: independent
  sets_code: sometimes
  tests:
    - "Clamp the hose from the purge valve to the intake manifold at idle; a steadier idle means it was leaking"
    - "Engine off: hand vacuum pump on the inlet port with the connector unplugged - it must hold vacuum"
    - "Engine running, connector unplugged: feel for vacuum at the canister-side port; flow with no command means stuck open"
    - "Scan tool: command purge duty 0% then 100% and confirm rpm and short-term trim react only when commanded open"
  fix: Replace the valve. Cleaning a valve that has failed to seal is not a repair.
  cost: Part typically inexpensive.
  applies_to:
    models: [Ford F-150]
    years: [2009, 2014]
  provenance:
    - source: community
      confidence: medium
      verified: false
      note: >
        Reported as a very common failure point on the 2009-2014 F-150, with
        rough idle and hard starting after refuelling, and noted as sometimes
        setting no code. Read from search-engine summaries only.
      check: >
        Confirm three claims separately: (1) that it is specifically common on
        the 2009-2014 generation rather than F-150s generally, (2) that a
        stuck-open valve is documented as producing rough idle with NO code -
        this is the claim that makes it fit this truck, and (3) the part
        number and location for the 3.7 specifically.
      url: https://truckpowered.com/ford-f-150-purge-valve-symptoms-location-replacement-guide/
    - source: community
      confidence: medium
      verified: false
      note: Second independent account of the same failure and its test method.
      check: >
        Confirm the two bench tests quoted in `tests` above are as this source
        describes them, particularly the direction of the vacuum test.
      url: https://engineneeds.com/ford-f150-evap-purge-valve/
    - source: community
      confidence: medium
      verified: false
      note: >
        SAME ENGINE. Mustang 3.7 sources state that the common failure mode of
        Ford's purge valve is to be stuck OPEN, and that vacuum lines leak
        particularly at the purge valve. A 2014 Mustang V6 case reported rough
        idle after refuelling and on cold start traced to a bad purge valve -
        notable because the codes were P2196 and P2198 (oxygen sensor signal
        biased rich) rather than EVAP codes. From search summaries.
      check: >
        Confirm the stuck-open-is-the-common-failure claim, and confirm the
        P2196/P2198 case - a purge valve presenting as O2 rich codes rather
        than EVAP codes would change what codes we look for.
      url: https://www.mustang6g.com/forums/threads/diagnosing-a-bad-evap-purge-valve.107593/
  notes: >
    On this truck: never inspected in twelve years. Top candidate if the idle
    measurement shows a genuine fault.

    Test by disconnecting and plugging the manifold port with the ENGINE OFF -
    the lines on this engine are hard plastic and cannot be clamped, and
    opening a manifold port on a running engine will stall it.

- id: pcv-leak
  title: PCV valve, hose or elbow cracked
  summary: >
    Crankcase ventilation rubber hardens with heat and age. A split elbow or
    hose is an unmetered air leak with exactly the load signature of any other
    vacuum leak.
  systems: [pcv, intake]
  symptoms:
    - rough idle
    - unstable rpm
    - lean fuel trims at idle
  codes: [P0171, P0174]
  load_signature: worst-at-idle
  temperature: independent
  sets_code: sometimes
  tests:
    - "Pull the PCV valve and shake it - no rattle means clogged. It sits on the passenger-side valve cover, roughly halfway towards the front [VERIFY on the F-150; that position is documented for the Mustang 3.7]"
    - "Flex the hose and both elbows by hand with the engine hot and running - heat-hardened rubber opens when flexed and closes cold, so a cold inspection misses it"
    - "ENGINE OFF, disconnect the PCV line at the manifold and plug that port, then restart and measure. PCV is a metered air path, so blocking it shifts the idle even on a healthy engine - the signal is whether the INSTABILITY reduces, not whether the rpm number moves"
    - "Oil filler cap test at idle: a large idle drop means restricted ventilation, a smoothing means crankcase pressure"
  fix: Replace the cracked component.
  cost: Very low.
  provenance:
    - source: community
      confidence: medium
      verified: false
      note: >
        Owner reports name a cracked PCV hose or rotted elbow as the entire fix
        for a months-long rough idle with no check engine light. From search
        summaries.
      check: >
        Confirm the reports concern a Ford V6 or V8 of comparable design rather
        than an unrelated engine, and note whether any names the 3.7.
      url: https://repairpal.com/rough-idle-due-to-cracked-pcv-hose-856
    - source: community
      confidence: medium
      verified: false
      note: >
        SAME ENGINE, and this largely answers the open question of whether a
        serviceable valve exists. The PCV valve on the 2011 Mustang 3.7 V6 is
        described as sitting on the passenger-side valve cover, roughly halfway
        towards the front of the engine, and as removable - the documented test
        is to pull it and shake it, with no rattle meaning clogged. Mustang 3.7
        sources also name PCV valve clogging and vacuum leaks as a known cause
        of rough idle on this engine. From search summaries.
      check: >
        Confirm the location on the F-150 specifically - the engine is shared
        but the installation is not, so the valve may be positioned or routed
        differently in the truck. Then confirm a PCV valve part number exists
        for the 2014 F-150 3.7L.
      url: https://www.justanswer.com/ford/oamwy-pcv-valve-location-2011-v6-mustang-3-7.html

- id: unmetered-air
  title: Unmetered air entering downstream of the mass air flow sensor
  summary: >
    Any air that enters after the MAF is unmeasured, so the mixture goes lean
    and fuel trim corrects positive. The correction is large at idle and small
    at higher airflow, which is what makes the idle-versus-2500-rpm comparison
    diagnostic.
  systems: [intake]
  symptoms:
    - positive long-term fuel trim at idle that shrinks at higher rpm
    - unstable idle
  codes: [P0171, P0174]
  load_signature: worst-at-idle
  temperature: independent
  sets_code: sometimes
  tests:
    - "Compare long-term trim at idle against 2500 rpm no load; a fall of more than about 5% points at a leak"
    - "Smoke test the intake with the PCV and purge lines disconnected and their ports plugged first, then again connected - the difference isolates the valves from the manifold"
    - "Vacuum gauge at idle: steady 18-22 inHg near sea level is healthy; low-and-steady suggests a leak"
  fix: Locate and seal. Suspect the purge valve, PCV and booster hoses before the manifold gaskets.
  cost: Depends entirely on location.
  provenance:
    - source: inferred
      confidence: high
      verified: false
      note: >
        Standard fuel-trim interpretation. The shrinking-correction test is
        general engine management theory, not a vehicle-specific claim, which
        is why confidence is high despite being unverified.
      check: >
        Confirm the ±10% trim tolerance and the 18-22 inHg idle vacuum figure
        against a diagnostic reference rather than memory. Both are quoted as
        decision thresholds in this tool.
  notes: >
    Trims decide whether a smoke test is worth doing. Within about ±10% at
    idle, no leak present is large enough to explain a shake, and a smoke test
    only surfaces leaks too small to matter.

- id: booster-leak
  title: Brake booster or check valve leaking
  summary: >
    The booster is a large vacuum consumer connected straight to the manifold.
    A leaking diaphragm or check valve is an unmetered air leak.
  systems: [brakes, intake]
  symptoms:
    - unstable idle
    - lean trims
    - sometimes a hiss from the pedal area
  load_signature: worst-at-idle
  temperature: independent
  sets_code: sometimes
  tests:
    - "ENGINE OFF, disconnect the booster hose at the manifold and plug that port, then restart and measure. Sealing it should change nothing on a healthy system. Vehicle stationary; the booster keeps only stored vacuum while isolated, so assist fades after a few pedal applications and returns on reconnection"
  fix: Replace the check valve or the booster.
  cost: Low for a check valve.
  provenance:
    - source: inferred
      confidence: high
      verified: false
      note: Standard vacuum-leak diagnosis; no vehicle-specific claim made.
      check: >
        Confirm the 2014 F-150 booster hose has an inline check valve and where
        it sits, so the clamp goes on the correct side of it.

- id: throttle-body-carbon
  title: Carbon around the throttle plate
  summary: >
    Deposits on the plate edge and bore distort the small airflow the PCM
    meters at idle. Matters only at small plate openings, so it disappears
    under load.
  systems: [intake]
  symptoms:
    - unstable idle
    - idle drops on deceleration
  load_signature: worst-at-idle
  temperature: independent
  sets_code: rarely
  tests:
    - "Remove the intake duct and inspect the plate edge and the bore behind it - spraying cleaner through the duct leaves the downstream edge untouched, which is the part that matters"
    - "After any cleaning, run the idle relearn or the idle will be worse than before"
  fix: Remove the throttle body and clean by hand, then relearn.
  cost: Low.
  provenance:
    - source: measured
      confidence: high
      verified: true
      note: >
        ELIMINATED ON THIS TRUCK. The throttle body was removed from the
        manifold and hand-cleaned - the method that actually reaches the
        downstream plate edge and the bore - and the symptom did not change.
        A properly conducted test with a negative result, performed on this
        vehicle and reported by its owner.
      url: "owner report, this vehicle, VIN 1FTMF1EM1EFC80632"
    - source: community
      confidence: medium
      verified: false
      note: >
        Widely reported as a rough-idle cause and a common first repair. From
        search summaries.
      check: >
        Low value now that the on-vehicle test is negative. Verify only if the
        entry is reused for a different vehicle.

- id: vibration-frequency-test
  title: Measure the vibration's frequency, not the tachometer
  summary: >
    A felt vibration and a moving tachometer are different phenomena on
    different timescales, and an OBD log cannot resolve the first. At 660 rpm
    a V6 fires three times per revolution - 33 Hz. A generic scan tool samples
    rpm at around 0.3 Hz. The vibration is four orders of magnitude faster
    than the measurement.
  systems: [nvh, engine]
  symptoms:
    - vibration felt in the cab with no fault found electronically
    - normal idle rpm and normal fuel trims alongside a felt shake
  load_signature: worst-at-idle
  temperature: independent
  sets_code: never
  tests:
    - "Phone accelerometer or spectrum app, phone flat on the seat or console, warm idle. Read the dominant frequency"
    - "Compare against engine orders at the observed idle speed. For a V6 at 660 rpm: 1st order (rotational) is 11 Hz, firing frequency (3 per revolution) is 33 Hz"
    - "Dominant at firing frequency means the combustion pulse itself is being felt - normal, especially in a cab with little sound deadening"
    - "Dominant at 1st order means rotational imbalance - harmonic balancer, pulley, flexplate"
    - "Repeat on a second vehicle of the same model and engine for a reference reading"
  fix: >
    Nothing, if it is at firing frequency. If at 1st order, chase the rotating
    assembly.
  cost: Free - the phone is the instrument.
  provenance:
    - source: measured
      confidence: high
      verified: true
      note: >
        Established on this vehicle. Six rpm recordings of 10-15 minutes at
        warm idle show a 30 rpm band once single-sample adapter dropouts are
        excluded, with a slow 4-5 minute cycle attributable to cooling fan and
        purge cycling. Normal idle control - and at roughly 0.3 Hz sampling,
        incapable of showing a 33 Hz vibration. The measurement and the
        complaint were on different timescales.
      url: "owner scan, this vehicle, VIN 1FTMF1EM1EFC80632, 2026-09"
    - source: inferred
      confidence: high
      verified: false
      note: >
        Engine order arithmetic: a four-stroke V6 fires three times per
        crankshaft revolution, so firing frequency in Hz is rpm/60 x 3.
      check: >
        Confirm the firing-order arithmetic and typical idle NVH frequencies
        against an NVH reference before quoting the numbers to anyone else.
