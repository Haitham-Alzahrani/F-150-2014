[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f150diag"
version = "0.1.0"
description = "Read-only OBD-II diagnostic tool for a 2014 Ford F-150 3.7 Ti-VCT"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "PyYAML>=6.0",
    # The car link and every service in data/f150_obd2.py.  0.7.3 is the
    # version every claim in docs/SCANNER-PARITY.md was verified against,
    # including the service 09 decoder bug worked around there.
    "obd>=0.7.3",
    # data/rpm_rate.py, idle_events.py, did_scan.py and check_capture.py.
    "numpy>=1.24",
]

[project.scripts]
f150diag = "f150diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f150diag = ["**/*.yaml", "**/*.yml"]
